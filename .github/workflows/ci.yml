name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make libcurl4-openssl-dev libsqlite3-dev libseccomp-dev

      - name: Build
        run: make build

      - name: Run tests
        run: make test
